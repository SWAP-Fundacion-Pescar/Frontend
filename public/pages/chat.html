<!DOCTYPE html>
<html lang="es-AR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/nav+footer.css">
    <link rel="stylesheet" href="../styles//chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
</head>

<body>
    <header>
        <nav class="nav">
            <!-- Logo -->
            <div class="nav__logo">
                <img src="../assets/img/ImagenLogo.png" alt="Logo Swap" class="nav__logo__img">
                <button class="nav__btnHamburger--open" id="abrirMenu"><i class="fa-solid fa-bars"></i></button>
            </div>
            <div class="nav__containerMenu">
                <!-- Search bar -->
                <div class="nav__containerMenu__searchBar">
                    <input id="searchBar" name="searchBar" type="text" placeholder="Buscar productos">
                    <button>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <!-- Nav bar links -->
                <!-- No logueado -->
                <div class="nav__containerMenu__menu" id="nav__menu">
                    <button class="nav__btnHamburger--close" id="cerrarMenu"> <i class="fa-solid fa-xmark"></i> </button>
                    <a href="#intercambiar">Intercambiar</a>
                    <a href="#reseñas">Reseñas</a>
                    <a href="#quienesSomos">Quienes somos</a>
                </div>
                <!-- Logueado -->
                <div class="nav__containerMenu__menu" id="nav__menu-logged">
                    <button class="nav__btnHamburger--close" id="cerrarMenu"> <i class="fa-solid fa-xmark"></i>
                    </button>
                    <a href="../pages/catalogo.html">Catálogo</a>
                    <a href="../pages/chat.html">Chat</a>
                    <a href="../pages/favoritos.html">Favoritos</a>
                </div>
            </div>
            <!-- Botones de usuario -->
            
            <!-- No logueado -->
            <div class="nav__userButton" id="nav__userButton">
                <a href="../pages/logIn.html" class="button--outlined button">Iniciar Sesión</a>
                <a href="../pages/signIn.html" class="button--filled button">Registrate</a>
            </div>

            <!-- Logueado -->
            <div class="nav__userButton-logged" id="nav__userButton-logged">
        
                <div class="dropdown__container">
                    <button class="dropdown__btn" id="btn_bell">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div class="dropdown__window" id="menu_bell">
                        <a href="#">
                            Not. General 1
                        </a>
                        <a href="#">
                            Not. General 2
                        </a>
                    </div>
                </div>
                
                <div class="dropdown__container">
                    <button class="dropdown__btn" id="btn_chat">
                        <i class="fa-regular fa-message"></i>
                    </button>
                    <div class="dropdown__window" id="menu_chat">
                        <a href="#">
                            Not. Chat 1
                        </a>
                        <a href="#">
                            Not. Chat 2
                        </a>
                    </div>
                </div>

                <div class="dropdown__container">
                    <button class="dropdown__btn" id="btn_user">
                        <i class="fa-regular fa-user"></i>
                    </button>
                    <div class="dropdown__window" id="menu_user">
                        <a id="user-profile" href="../pages/perfil.html">
                            Ver perfil
                        </a>
                        <a href="../pages/editarperfil.html">
                            Editar Perfil
                        </a>
                        <a id="logoutBtn" href="#">
                            Cerrar sesión
                        </a>
                    </div>
                </div>
                
                <!-- <button class="button button--filled" id="logoutBtn">Salir</button> -->
            </div>
        </nav>
    </header>
    <main>
        <div class="chats-section">
            <h3>Mensajes</h3>
            <div class="chats">               
            </div>
        </div>
        <div class="currentChat">
            <div class="currentChat-header">
                <div class="currentChat-header-info">
                    <div class="currentChat-pfp-container">
                        <img class="currentChat-pfp" src="" alt="">
                    </div>
                    <div class="currentChat-header-info-details">
                        <h4 class="currentChat-name"></h4>
                    </div>
                </div>
            </div>
            <div class="currentChat-messages">
            </div>
            <div class="currentChat-input">
                <input class="mediaInput" type="file" id="mediaInput" style="display: none;">
                <label for="mediaInput" class="media-label">
                    <i class="icon">📎</i>
                </label>
                <input class="newMessage" type="text" placeholder="Envía un mensaje...">
            </div>
        </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/chat.js" type="module"></script>
    <script src="../js/generales/navegacion.js"></script>
</body>

</html>
